name: Backend CI
on:
  push:
    branches:
      - master
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  REGISTRY: ghcr.io
  RUST_VERSION: 1.85.0

jobs:
  cancel-previous-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.9.1
        with:
          access_token: ${{ github.token }}

  cargo-fmt-check:
    needs: cancel-previous-runs
    runs-on: warp-ubuntu-latest-x64-4x
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Check Formatting
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all --verbose -- --check

  cargo-clippy:
    needs: cancel-previous-runs
    runs-on: warp-ubuntu-latest-x64-4x
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: WarpBuilds/rust-cache@v2
      - name: Check Clippy Linter
        uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --all-features --all-targets -- -D warnings

  cargo-check:
    needs: cancel-previous-runs
    runs-on: warp-ubuntu-latest-x64-4x
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ env.RUST_VERSION }}
      - uses: WarpBuilds/rust-cache@v2
      - name: Run tests
        uses: actions-rs/cargo@v1
        with:
          command: check
          args: --verbose

  cargo-test:
    needs: cancel-previous-runs
    runs-on: warp-ubuntu-latest-x64-4x
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ env.RUST_VERSION }}
      # Set up Docker (already available on GitHub-hosted runners)
      - name: Set up Docker
        run: |
          docker --version
          docker info
      - name: Start local database with environment
        run: |
          cp .env.example .env.local
          docker compose up -d db
      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            if docker compose exec -T db pg_isready -U "${POSTGRES_USER:-postgres}" -d "${POSTGRES_DB_NAME}"; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs db
          exit 1
      # `cargo-binstall` is required at test time: the forc-install tests
      # (`install_binaries_at_path_*`, `handle_project_upload_success`) shell out to
      # `cargo binstall` to fetch prebuilt forc release binaries.
      - name: setup binstall
        uses: taiki-e/install-action@cargo-binstall
      - uses: WarpBuilds/rust-cache@v2
      - name: Run tests
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --verbose --all --all-features

  build-and-publish-image:
    needs:
      - cargo-fmt-check
      - cargo-clippy
      - cargo-check
      - cargo-test
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: FuelLabs/github-actions/.github/workflows/docker-build-push.yml@master
    secrets:
      REGISTRY_USERNAME: ${{ github.repository_owner }}
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    with:
      auth-mode: registry-login
      registry: ghcr.io
      build-backend: native
      platforms: linux/amd64,linux/arm64
      runs-on-amd64: ubuntu-latest
      runs-on-arm64: ubuntu-24.04-arm
      dockerfile: deployment/Dockerfile
      docker-context: .
      image: ghcr.io/fuellabs/forc.pub
      tags: |
        type=ref,event=branch
        type=sha,prefix=
        type=semver,pattern={{raw}}
